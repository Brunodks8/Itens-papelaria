<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="UTF-8">
  <title>Saída itens industrial</title>

  <style>

  input {
  border-radius: 6px;
  border: 1px solid #ccc;
}

  body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    margin: 0;
    padding: 0;
  }

 .container {
  max-width: 420px;
  margin: 0 auto;
  padding: 24px 16px;
  background: #fff;
  min-height: 100vh;
  box-sizing: border-box;

  display: flex;
  flex-direction: column;
  justify-content: center;   /* 🔥 centraliza verticalmente */
}

  h2 {
    text-align: center;
    margin-bottom: 20px;
  }

  input, button {
    width: 100%;
    padding: 12px;
    margin-bottom: 12px;
    font-size: 16px;
    box-sizing: border-box;
  }

  button {
    background: #007bff;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-weight: bold;
  }

  button:active {
    opacity: 0.9;
  }

.autocomplete-wrapper {
  position: relative;
}

.sugestoes {
  position: absolute;
  top: 100%;
  left: 0;
  width: 100%;
  max-height: 120px;   /* altura da barrinha */
  overflow-y: auto;    /* scroll */
  background: #fff;
  border: 1px solid #ccc;
  border-top: none;
  border-radius: 0 0 6px 6px;
  box-shadow: 0 6px 12px rgba(0,0,0,0.15);
  z-index: 1000;
}

.sugestoes div {
  padding: 10px;
  cursor: pointer;
}

.sugestoes div:hover {
  background: #007bff;
  color: #fff;
}
</style>
</head>

<body>

<div class="container">
  <h2>Saída Itens industrial</h2>

  <form id="form">

  <!-- ITEM -->
  <div class="autocomplete-wrapper">
  <input id="item" name="item" placeholder="Digite o item..." autocomplete="off" required>
  <div id="sugestoesItem" class="sugestoes"></div>
</div>

  <!-- QUANTIDADE -->
  <input name="quantidade" type="number" placeholder="Quantidade" required>

  <!-- NOME -->
  <div class="autocomplete-wrapper">
  <input id="nome" name="nome" placeholder="Digite o nome..." autocomplete="off" required>
  <div id="sugestoesNome" class="sugestoes"></div>
</div>

  <!-- OBS -->
  <input name="obs" placeholder="Observação">

  <button type="submit">Enviar</button>

</form>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzuglRaDnQw9pLF243Jh-yht1TbbZcwBKuOhwgi3WHOhY4bD4qK6fTEpQZI5S50pEdPnQ/exec";

let itens = [];
let nomes = [];

/* BUSCAR DADOS */
fetch(API_URL + "?tipo=itens")
  .then(r => r.json())
  .then(d => itens = d);

fetch(API_URL + "?tipo=nomes")
  .then(r => r.json())
  .then(d => nomes = d);

/* AUTOCOMPLETE GENÉRICO */
function ativarAutocomplete(input, box, fonte) {
  input.addEventListener("input", () => {
    box.innerHTML = "";
    const valor = input.value.toLowerCase();
    if (!valor) return;

    fonte()
      .filter(v => v.toLowerCase().includes(valor))
      .slice(0, 3)
      .forEach(v => {
        const div = document.createElement("div");
        div.textContent = v;
        div.onclick = () => {
          input.value = v;
          box.innerHTML = "";
        };
        box.appendChild(div);
      });
  });
}

/* ATIVAR AUTOCOMPLETE */
ativarAutocomplete(
  document.getElementById("item"),
  document.getElementById("sugestoesItem"),
  () => itens
);

ativarAutocomplete(
  document.getElementById("nome"),
  document.getElementById("sugestoesNome"),
  () => nomes
);

/* SUBMIT */
document.getElementById("form").addEventListener("submit", async e => {
  e.preventDefault();

  const form = e.target;
  const dados = Object.fromEntries(new FormData(form));

  const itemDigitado = dados.item.trim().toLowerCase();
  const nomeDigitado = dados.nome.trim().toLowerCase();

  const itemValido = itens
    .map(i => i.trim().toLowerCase())
    .includes(itemDigitado);

  const nomeValido = nomes
    .map(n => n.trim().toLowerCase())
    .includes(nomeDigitado);

  if (!itemValido) {
    alert("❌ Item não encontrado na base.");
    document.getElementById("item").focus();
    return;
  }

  if (!nomeValido) {
    alert("❌ Nome não encontrado na base.");
    document.getElementById("nome").focus();
    return;
  }

  await fetch(API_URL, {
    method: "POST",
    body: JSON.stringify(dados)
  });

  alert("✅ Registro enviado com sucesso!");
  form.reset();
});
</script>

</body>
</html>
